name: Stable Docker release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
          docker compose config --quiet
          docker compose -f compose.release.yaml config --quiet
      - name: Docker smoke test
        run: |
          docker compose up -d --build --wait
          curl --fail http://127.0.0.1:8020/health
      - name: Stop test container
        if: always()
        run: docker compose down
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mrpointblue/autotrial-event-management:${{ steps.version.outputs.value }}
            ghcr.io/mrpointblue/autotrial-event-management:stable
            ghcr.io/mrpointblue/autotrial-event-management:latest
          labels: |
            org.opencontainers.image.source=https://github.com/mrpointblue/Autotrial-Event-Management
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" compose.release.yaml --verify-tag --title "Autotrial ${{ steps.version.outputs.value }}" --notes-file RELEASE_NOTES.md --latest
