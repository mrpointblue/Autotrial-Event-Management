<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autotrial · Anmeldung</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><section class="card"><h1>{{ 'Autotrial einrichten' if setup else 'Anmelden' }}</h1>{% if setup %}<p>Willkommen! Wählen Sie einen Benutzernamen und ein Passwort für Ihr erstes Administratorkonto.</p>{% endif %}<form method="post" action="{{ '/setup' if setup else '/login' }}">{% if not setup %}<label>Verein / Veranstalter<select name="organizer_id" required><option value="">Bitte auswählen</option>{% for o in organizers %}<option value="{{ o.id }}">{{ o.name }} · {{ 'V%03d'|format(o.number) }}</option>{% endfor %}</select></label>{% endif %}<label>Benutzername<input name="username" required minlength="3" maxlength="100" autocomplete="username"></label><label>Passwort<input name="password" type="password" required {% if setup %}minlength="12"{% endif %} maxlength="256" autocomplete="{{ 'new-password' if setup else 'current-password' }}"></label><button>{{ 'Konto anlegen' if setup else 'Anmelden' }}</button></form></section></main></body></html>
